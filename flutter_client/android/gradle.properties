org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# These two flags were added automatically by the Flutter migrator and must
# stay false while the project is on AGP 8. They also document why AGP 9 is
# not reachable yet: on AGP 9 the three consumers disagree irreconcilably --
# Flutter's own Gradle plugin needs the old DSL, file_picker 11 needs
# built-in Kotlin, and package_info_plus/share_plus still require KGP, which
# built-in Kotlin forbids. Revisit once Flutter's plugin supports the new DSL.
android.builtInKotlin=false
android.newDsl=false

# Kotlin incremental compilation is off deliberately -- see #159 for the full
# investigation. Two independent reasons:
#
# 1. It is a net loss here. CI always builds clean, so incremental mode pays to
#    construct caches it never reuses: ~1m20s slower per run, measured. The
#    Kotlin that would benefit barely exists -- the plugin subprojects are pub
#    packages whose sources never change (Gradle's up-to-date checks already
#    skip them) and this app's own Kotlin is essentially just MainActivity.
#
# 2. With it on, every :<plugin>:compileDebugKotlin fails on Windows with
#    "Could not close incremental caches ... class-fq-name-to-source.tab".
#    The caches are memory-mapped and the Kotlin compile daemon keeps them
#    open; Windows will not delete a mapped file that is still held, while
#    Linux unlinks it happily -- which is why CI never saw this. Not a KGP
#    defect awaiting an upstream fix, so there is nothing here to wait for.
#
# Windows devs who do want incremental Kotlin can set BOTH of these in their
# personal ~/.gradle/gradle.properties, keeping CI on the faster path:
#   kotlin.incremental=true
#   kotlin.compiler.execution.strategy=out-of-process
# out-of-process forks a JVM per compile, so the mappings are released before
# Gradle cleans them. It is the only strategy that works; daemon and
# in-process both fail.
kotlin.incremental=false
