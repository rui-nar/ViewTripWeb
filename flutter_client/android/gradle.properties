org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# These two flags were added automatically by the Flutter migrator and must
# stay false while the project is on AGP 8. They also document why AGP 9 is
# not reachable yet: on AGP 9 the three consumers disagree irreconcilably --
# Flutter's own Gradle plugin needs the old DSL, file_picker 11 needs
# built-in Kotlin, and package_info_plus/share_plus still require KGP, which
# built-in Kotlin forbids. Revisit once Flutter's plugin supports the new DSL.
android.builtInKotlin=false
android.newDsl=false

# Kotlin incremental compilation is broken for the plugin subprojects under
# Gradle 9: every :<plugin>:compileDebugKotlin task dies with
#   java.lang.Exception: Could not close incremental caches in
#   ...\caches-jvm\jvm\kotlin: class-fq-name-to-source.tab, ...
# Reproduced on Gradle 9.3.1/9.6.1, AGP 8.13.2/9.3.1, KGP 2.3.20/2.4.10, JDK
# 21 and 25, with antivirus both enabled and fully disabled, always on a clean
# build. Turning incremental compilation off is the only thing that clears it.
# Costs rebuild speed; revisit when KGP fixes Build Tools API caches on Gradle 9.
kotlin.incremental=true
