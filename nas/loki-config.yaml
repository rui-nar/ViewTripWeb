# Loki, monolithic mode, filesystem storage — no object store (S3/MinIO)
# needed at this scale. See ../docs/OBSERVABILITY.md for the reasoning and
# the LogQL queries this is meant to serve.
#
# No secrets in this file — committed as-is, no .example copy step needed.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 30 days — matches src/backup/backup_service.py's existing backup
  # retention convention. Adjust if real log volume makes that too much (or
  # too little) disk once you've seen a few weeks of it.
  retention_period: 720h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem
